services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: movieflex-gpt
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
      # Load environment variables from .env file
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/index.html"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
